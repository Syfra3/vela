active_gate:
  name: targeted-go-verification
  rationale: >-
    Full `go test ./...` is not the active final gate because it is blocked by
    known malformed detect fixture packages containing empty `.go` files. The
    release gate uses the packages that have been part of scenario verification
    and excludes those malformed fixture packages without masking production or
    scenario test failures.
  commands:
    - command: go test ./cmd/... ./internal/... ./pkg/... ./scripts ./tests/fixtures/extract -count=1
      required: true
    - command: go vet ./cmd/... ./internal/... ./pkg/... ./scripts ./tests/fixtures/extract
      required: true
    - command: go mod tidy -diff
      required: true
    - command: go test ./cmd/vela -run 'TestSCN025_' -count=1
      required: true

known_non_gate_blockers:
  - command: go test ./... -count=1
    status: known_failure
    reason: >-
      Malformed detect fixture packages include empty `.go` files and fail before
      package tests can run. This limitation is tracked as a fixture issue, not
      a Vela v0.4 final gate requirement.
    known_errors:
      - tests/fixtures/detect/gitignore_project/src/app.go: expected 'package', found 'EOF'
      - tests/fixtures/detect/velignore_project/generated/schema.go: expected 'package', found 'EOF'
      - tests/fixtures/detect/velignore_project/src/main.go: expected 'package', found 'EOF'

release_evidence:
  hard_spec: specs/vela-v0.4-hard-spec.md
  approval_marker: specs/.approved
  implementation_marker: specs/.implementation-complete
  tdd_log: .uncle-bob/tdd-log.md
  scn_025_smoke_report: reports/SCN-025-real-workspace-smoke.md
  judge_report: reports/judge_report.md

warnings:
  - SCN-025 passed with warnings using a maintainer-selected real workspace smoke test and no-secrets redaction.
  - SCN-019 success-path and generated-artifact byte-for-byte restoration proof remain review warnings, not current semantic blockers.
